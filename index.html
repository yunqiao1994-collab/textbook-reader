<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>教材智能点读助手</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f4f6fb}
*{box-sizing:border-box}body{margin:0}header{background:#233b70;color:white;padding:18px 20px}
header h1{margin:0 0 5px;font-size:22px}header p{margin:0;font-size:13px;opacity:.9}
main{max-width:1100px;margin:18px auto;padding:0 14px}
.panel{background:white;border-radius:12px;padding:15px;margin-bottom:14px;box-shadow:0 2px 10px #1720330c}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,.filelabel,select{border:1px solid #ccd4e2;border-radius:8px;padding:10px 12px;background:#fff;font-size:14px;cursor:pointer}
button.primary{background:#2b58a4;color:#fff;border-color:#2b58a4}button:disabled{opacity:.48;cursor:not-allowed}
input[type=file]{max-width:100%}.hint{font-size:13px;color:#5d687d;line-height:1.6}
#status{margin-top:10px;font-size:14px;color:#2b58a4;white-space:pre-wrap}
#pages{display:flex;flex-direction:column;gap:18px}
.page-wrap{background:white;padding:8px;box-shadow:0 2px 12px #1720331a;border-radius:4px;overflow:auto}
.page{position:relative;margin:auto;width:max-content;max-width:100%}
.page canvas{display:block;max-width:100%;height:auto;cursor:default}.page.selecting canvas{cursor:crosshair}.selection-box{position:absolute;border:2px solid #e04b35;background:rgba(255,190,60,.16);pointer-events:none;z-index:5}.selection-label{font-size:12px;color:#b13b2b;margin-top:4px}
.overlay{position:absolute;inset:0;pointer-events:none}
.wordline{position:absolute;pointer-events:auto;border:1px solid rgba(35,91,170,.18);background:rgba(255,226,90,.035);padding:0;margin:0;cursor:pointer;overflow:hidden;color:transparent;font-size:1px;line-height:1}
.wordline:hover{background:rgba(255,220,55,.35);border-color:#d3a900}.wordline:active{background:rgba(70,150,255,.28)}
.wordline:focus{outline:2px solid #2b58a4}
.page-title{font-size:12px;color:#65718a;margin:4px 0 8px}
#floatingTools{position:fixed;z-index:1000;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:9px;background:rgba(255,255,255,.97);border:1px solid #ccd4e2;border-radius:14px;box-shadow:0 6px 24px #1720332b;max-width:calc(100vw - 20px)}#floatingTools button{white-space:nowrap}body{padding-bottom:84px}
@media(max-width:600px){header h1{font-size:19px}.panel{padding:12px}.controls>*{width:100%}select,button{min-height:42px}}
</style>
</head>
<body>
<header><h1>📚 教材智能点读助手</h1><p>扫描版 PDF · 越南语 OCR · 可手动框选正文 · 点击文字朗读</p></header>
<main>
<section class="panel">
 <div class="controls">
  <input id="pdfFile" type="file" accept="application/pdf,.pdf">
  <select id="lang" aria-label="识别语言">
   <option value="vie" selected>越南语（优先准确识别，推荐）</option>
   <option value="vie+eng">越南语 + 英语（混合文本）</option>
   <option value="eng">英语</option>
   <option value="chi_sim+eng">简体中文 + 英语</option>
   <option value="chi_sim">简体中文</option>
  </select>
  <select id="voiceLang" aria-label="地域口音">
   <option value="auto">口音：自动选择</option>
   <optgroup label="中文">
    <option value="zh-CN">普通话（中国大陆）</option>
    <option value="zh-TW">台湾国语（设备支持时）</option>
    <option value="zh-HK">香港粤语（设备支持时）</option>
   </optgroup>
   <optgroup label="越南语">
    <option value="vi-VN">越南语（越南）</option>
   </optgroup>
   <optgroup label="英语">
    <option value="en-US">英语（美国）</option>
    <option value="en-GB">英语（英国）</option>
    <option value="en-AU">英语（澳大利亚）</option>
   </optgroup>
  </select>
  <label style="display:flex;gap:8px;align-items:center;border:1px solid #ccd4e2;border-radius:8px;padding:8px 10px;background:#fff">
   语速 <input id="rate" type="range" min="0.6" max="1.4" value="1" step="0.1" style="width:100px">
   <span id="rateValue">1.0×</span>
  </label>
  <button id="previewVoiceBtn" type="button">试听当前语音</button>
  <label style="display:flex;gap:6px;align-items:center;border:1px solid #ccd4e2;border-radius:8px;padding:8px 10px;background:#fff"><input id="strictText" type="checkbox" checked> 优先正文，过滤插图零散文字</label>
  <button id="selectBtn" type="button">框选正文区域</button>
  <button id="clearSelectBtn" type="button">清除框选</button>
  <button id="ocrBtn" class="primary" disabled>识别并生成点读区域</button>
  <button id="stopOcrBtn" type="button" disabled>停止识别</button>
  <button id="stopBtn">停止朗读</button>
 </div>
 <div id="status">请选择一本扫描版 PDF。文件在浏览器中处理，不会上传到本网站服务器。</div>
 <p class="hint">首次识别需要联网下载识别引擎和语言数据。底部浮动操作栏会随页面滚动保持可见。框选时必须先点击“结束框选区域”，才能开始识别；识别过程中可点击“停止识别”中断。存在任意框选时，框选优先，只识别已框选页面，未框选页面会跳过。点击“清除框选”可恢复整页识别。框内若包含插图文字，仍可能被识别。</p>
</section>
<section id="pages"></section>
</main>
<div id="floatingTools" aria-label="页面浮动操作栏"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
(() => {
 const fileInput=document.getElementById('pdfFile'), langSelect=document.getElementById('lang'),
 voiceSelect=document.getElementById('voiceLang'), ocrBtn=document.getElementById('ocrBtn'),
 status=document.getElementById('status'), pages=document.getElementById('pages');
 let pdfDoc=null, worker=null, currentFileName='', selectionMode=false, dragState=null, ocrRunning=false, cancelOcrRequested=false;
 if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 const say=(s)=>status.textContent=s;
 // Keep selection and OCR controls in a floating toolbar so they remain accessible while scrolling pages.
 const floatingTools=document.getElementById('floatingTools');
 ['selectBtn','clearSelectBtn','ocrBtn','stopOcrBtn'].forEach(id=>{const el=document.getElementById(id);if(el)floatingTools.appendChild(el);});
 fileInput.addEventListener('change', async()=>{
   if(ocrRunning){cancelOcrRequested=true; try{if(worker)worker.terminate()}catch(e){} worker=null;}
   ocrRunning=false; cancelOcrRequested=false; selectionMode=false; selectBtn.textContent='框选正文区域';
   pages.innerHTML=''; pdfDoc=null; ocrBtn.disabled=true; document.getElementById('stopOcrBtn').disabled=true;
   const f=fileInput.files[0]; if(!f)return;
   if(f.type!=='application/pdf'&&!f.name.toLowerCase().endsWith('.pdf')){say('目前此版本先支持 PDF 文件。');return}
   currentFileName=f.name; say('正在打开 PDF…');
   try{
     const bytes=await f.arrayBuffer();
     pdfDoc=await pdfjsLib.getDocument({data:bytes}).promise;
     say(`已打开：${f.name}\n共 ${pdfDoc.numPages} 页。点击“识别并生成点读区域”开始 OCR。`);
     ocrBtn.disabled=false;
     for(let n=1;n<=pdfDoc.numPages;n++){
       const pg=await pdfDoc.getPage(n);
       const viewport=pg.getViewport({scale:1.25});
       const wrap=document.createElement('div');wrap.className='page-wrap';
       const title=document.createElement('div');title.className='page-title';title.textContent=`第 ${n} 页`;
       const page=document.createElement('div');page.className='page';page.dataset.page=n;
       const canvas=document.createElement('canvas');canvas.width=Math.floor(viewport.width);canvas.height=Math.floor(viewport.height);
       canvas.style.width=viewport.width+'px';canvas.style.height=viewport.height+'px';
       const overlay=document.createElement('div');overlay.className='overlay';
       page.append(canvas,overlay);wrap.append(title,page);pages.append(wrap);
       await pg.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
       page.dataset.renderScale=viewport.scale;
       page.dataset.selection='';
       canvas.addEventListener('pointerdown',e=>startSelection(e,page,canvas));
       canvas.addEventListener('pointermove',e=>moveSelection(e,page,canvas));
       canvas.addEventListener('pointerup',e=>endSelection(e,page,canvas));
     }
     say(`PDF 已显示：${f.name}（${pdfDoc.numPages} 页）。准备就绪，可以开始识别。`);
   }catch(e){console.error(e);say('打开 PDF 失败：'+(e.message||e));}
 });

 // Manual region selection. Coordinates are stored in the original canvas pixel space.
 const selectBtn=document.getElementById('selectBtn');
 selectBtn.addEventListener('click',()=>{
   if(ocrRunning){say('正在识别，请先点击“停止识别”或等待识别结束，再进行框选。');return;}
   selectionMode=!selectionMode; selectBtn.textContent=selectionMode?'结束框选区域':'框选正文区域';
   pages.querySelectorAll('.page').forEach(p=>p.classList.toggle('selecting',selectionMode));
   say(selectionMode?'框选模式已开启：在页面上拖动鼠标框出正文。此时请勿点击识别。':'框选已结束。只要存在框选区域，框选区域优先，未框选页面不会进行整页识别。');
 });
 document.getElementById('clearSelectBtn').addEventListener('click',()=>{
   if(ocrRunning){say('正在识别，请先停止识别，再清除框选。');return;}
   dragState=null;
   pages.querySelectorAll('.selection-box').forEach(el=>el.remove());
   pages.querySelectorAll('.page').forEach(p=>{p.dataset.selection='';p.classList.remove('selecting')});
   selectionMode=false;selectBtn.textContent='框选正文区域';
   say('已清除所有框选区域。下一次识别将恢复整页识别模式。');
 });
 function startSelection(e,page,canvas){
   if(!selectionMode||ocrRunning)return;
   e.preventDefault(); const r=canvas.getBoundingClientRect();
   const x=Math.max(0,Math.min(canvas.width,(e.clientX-r.left)*canvas.width/r.width));
   const y=Math.max(0,Math.min(canvas.height,(e.clientY-r.top)*canvas.height/r.height));
   page.querySelectorAll('.selection-box').forEach(el=>el.remove());
   const box=document.createElement('div');box.className='selection-box';page.appendChild(box);
   dragState={page,canvas,box,startX:x,startY:y,currentX:x,currentY:y,rect:r};
   canvas.setPointerCapture?.(e.pointerId); updateSelectionBox();
 }
 function moveSelection(e,page,canvas){
   if(!dragState||dragState.page!==page)return;
   const r=canvas.getBoundingClientRect();
   dragState.currentX=Math.max(0,Math.min(canvas.width,(e.clientX-r.left)*canvas.width/r.width));
   dragState.currentY=Math.max(0,Math.min(canvas.height,(e.clientY-r.top)*canvas.height/r.height));
   updateSelectionBox();
 }
 function updateSelectionBox(){
   if(!dragState)return;const d=dragState, sx=d.canvas.clientWidth/d.canvas.width, sy=d.canvas.clientHeight/d.canvas.height;
   const x=Math.min(d.startX,d.currentX),y=Math.min(d.startY,d.currentY),w=Math.abs(d.currentX-d.startX),h=Math.abs(d.currentY-d.startY);
   d.box.style.left=(x*sx)+'px';d.box.style.top=(y*sy)+'px';d.box.style.width=(w*sx)+'px';d.box.style.height=(h*sy)+'px';
 }
 function endSelection(e,page,canvas){
   if(!dragState||dragState.page!==page)return;
   moveSelection(e,page,canvas);const d=dragState;dragState=null;
   const x=Math.round(Math.min(d.startX,d.currentX)),y=Math.round(Math.min(d.startY,d.currentY));
   const w=Math.round(Math.abs(d.currentX-d.startX)),h=Math.round(Math.abs(d.currentY-d.startY));
   if(w<20||h<20){d.box.remove();page.dataset.selection='';say('框选区域太小，请重新拖动选择更大的正文区域。');return;}
   page.dataset.selection=JSON.stringify({x,y,w,h});
   say(`第 ${page.dataset.page} 页已框选正文区域。需要识别的其他页面也可以分别框选。`);
 }
 function parseSelection(value,canvas){
   if(!value)return null;try{const r=JSON.parse(value);if(r.w>0&&r.h>0)return {x:Math.max(0,r.x),y:Math.max(0,r.y),w:Math.min(r.w,canvas.width-r.x),h:Math.min(r.h,canvas.height-r.y)};}catch(e){}return null;
 }
 function cropCanvas(source,r){const out=document.createElement('canvas');out.width=Math.max(1,Math.round(r.w));out.height=Math.max(1,Math.round(r.h));out.getContext('2d').drawImage(source,r.x,r.y,r.w,r.h,0,0,out.width,out.height);return out;}

 // OCR cache: IndexedDB stores recognized word boxes in this browser on this device.
 const CACHE_DB='textbook-reader-ocr-cache-v1', CACHE_STORE='pages';
 function openCacheDB(){
   return new Promise((resolve,reject)=>{
     const req=indexedDB.open(CACHE_DB,1);
     req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(CACHE_STORE))db.createObjectStore(CACHE_STORE,{keyPath:'key'});};
     req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
   });
 }
 async function cacheGet(key){
   try{const db=await openCacheDB();return await new Promise((resolve,reject)=>{
     const tx=db.transaction(CACHE_STORE,'readonly'),req=tx.objectStore(CACHE_STORE).get(key);
     req.onsuccess=()=>resolve(req.result?req.result.value:null);req.onerror=()=>reject(req.error);
   });}catch(e){console.warn('OCR cache read failed',e);return null;}
 }
 async function cacheSet(key,value){
   try{const db=await openCacheDB();return await new Promise((resolve,reject)=>{
     const tx=db.transaction(CACHE_STORE,'readwrite');tx.objectStore(CACHE_STORE).put({key,value});
     tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error);
   });}catch(e){console.warn('OCR cache write failed',e);return false;}
 }
 async function fileFingerprint(file){
   const bytes=await file.arrayBuffer();
   const digest=await crypto.subtle.digest('SHA-256',bytes);
   const hex=Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
   return {hex,bytes};
 }
 function showCachedLines(pageNum, lines, language){
   const page=pages.querySelector(`.page[data-page="${pageNum}"]`);
   if(!page)return;
   const canvas=page.querySelector('canvas'),overlay=page.querySelector('.overlay');
   overlay.innerHTML='';
   const scaleX=canvas.clientWidth/canvas.width,scaleY=canvas.clientHeight/canvas.height;
   lines.forEach(line=>{
     const x0=line.bbox.x0,y0=line.bbox.y0,x1=line.bbox.x1,y1=line.bbox.y1,text=line.text;
     const b=document.createElement('button');b.className='wordline';b.type='button';b.title='点击朗读：'+text;
     b.setAttribute('aria-label','朗读：'+text);b.textContent=text;
     b.style.left=(x0*scaleX)+'px';b.style.top=(y0*scaleY)+'px';
     b.style.width=Math.max(8,(x1-x0)*scaleX)+'px';b.style.height=Math.max(8,(y1-y0)*scaleY)+'px';
     b.addEventListener('click',()=>speak(text));overlay.appendChild(b);
   });
   const wrap=page.closest('.page-wrap'),title=wrap&&wrap.querySelector('.page-title');
   if(title)title.textContent=`第 ${pageNum} 页 · 已识别 ${lines.length} 行（缓存）`;
 }

 ocrBtn.addEventListener('click',async()=>{
   if(!pdfDoc)return;
   if(ocrRunning){say('识别正在进行中。需要停止时请点击“停止识别”。');return;}
   if(selectionMode){say('请先点击“结束框选区域”结束框选，再开始识别，避免操作冲突。');return;}
   ocrRunning=true; cancelOcrRequested=false; ocrBtn.disabled=true;
   document.getElementById('stopOcrBtn').disabled=false; selectBtn.disabled=true; document.getElementById('clearSelectBtn').disabled=true;
   try{
     const f=fileInput.files[0], language=langSelect.value;
     say('正在检查本机是否保存过这份教材的识别结果…');
     const fp=await fileFingerprint(f);
     if(cancelOcrRequested) throw new Error('用户已停止识别');
     const strictMode=document.getElementById('strictText').checked;
     const pageNodes=Array.from(pages.querySelectorAll('.page'));
     const hasAnySelection=pageNodes.some(p=>!!p.dataset.selection);
     const selectionKey=pageNodes.map(p=>p.dataset.selection|| (hasAnySelection?'skip':'full')).join(';');
     const cacheKey=fp.hex+'|'+language+'|ocr-v5-region-priority-'+(strictMode?'1':'0')+'|'+selectionKey;
     let cached=await cacheGet(cacheKey);
     if(cached && cached.pages && cached.pages.length===pdfDoc.numPages){
       if(cancelOcrRequested) throw new Error('用户已停止识别');
       cached.pages.forEach((lines,i)=>{if(Array.isArray(lines))showCachedLines(i+1,lines,language);});
       say(`已从本机缓存恢复识别结果：${f.name}\n${hasAnySelection?'框选优先模式：仅恢复已框选页面。':'整页识别模式。'}点击文字即可朗读。`);
       return;
     }
     if(worker){try{await worker.terminate()}catch(e){} worker=null;}
     say('正在启动文字识别引擎…首次使用会下载越南语识别数据，请保持页面打开。');
     worker=await Tesseract.createWorker(language,1,{logger:m=>{
       if(m.status==='recognizing text')say(`正在识别：第 ${activePage} 页 / ${pdfDoc.numPages} 页（${Math.round((m.progress||0)*100)}%）`);
       else if(m.status)say('识别引擎：'+m.status);
     }});
     try{await worker.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});}catch(e){console.warn('OCR parameter setup skipped',e)}
     const savedPages=[];
     for(let n=1;n<=pdfDoc.numPages;n++){
       if(cancelOcrRequested) throw new Error('用户已停止识别');
       activePage=n;
       const page=pages.querySelector(`.page[data-page="${n}"]`);
       const canvas=page.querySelector('canvas');
       // If any page has a selection, only selected pages are OCRed; unselected pages are skipped.
       const region=parseSelection(page.dataset.selection,canvas);
       if(hasAnySelection&&!region){
         const overlay=page.querySelector('.overlay');overlay.innerHTML='';
         savedPages.push(null);
         const wrap=page.closest('.page-wrap'),title=wrap&&wrap.querySelector('.page-title');
         if(title)title.textContent=`第 ${n} 页 · 未框选，已跳过`;
         await cacheSet(cacheKey,{pages:savedPages.concat(Array(Math.max(0,pdfDoc.numPages-savedPages.length)).fill(null)),partial:true});
         continue;
       }
       const source=region?cropCanvas(canvas,region):canvas;
       const ocrCanvas=makeOcrCanvas(source);
       const result=await worker.recognize(ocrCanvas);
       if(cancelOcrRequested) throw new Error('用户已停止识别');
       // Map OCR boxes from the 2x OCR image back to the original PDF canvas coordinates.
       const words=(result.data.words||[]).filter(w=>w.text&&w.text.trim()&&w.confidence>20).map(w=>({
         ...w,bbox:{x0:w.bbox.x0/2+(region?region.x:0),y0:w.bbox.y0/2+(region?region.y:0),x1:w.bbox.x1/2+(region?region.x:0),y1:w.bbox.y1/2+(region?region.y:0)}
       }));
       let grouped=groupLines(words);
       if(strictMode) grouped=filterIllustrationLikeLines(grouped, canvas.width, canvas.height, language);
       const lines=grouped.map(line=>{
         const xs=line.words.map(w=>w.bbox.x0),ys=line.words.map(w=>w.bbox.y0),
               xe=line.words.map(w=>w.bbox.x1),ye=line.words.map(w=>w.bbox.y1);
         return {bbox:{x0:Math.min(...xs),y0:Math.min(...ys),x1:Math.max(...xe),y1:Math.max(...ye)},
           text:line.words.map(w=>w.text).join(language.includes('chi_sim')?'':' ')};
       });
       savedPages.push(lines);
       showCachedLines(n,lines,language);
       // Save after each page so an interrupted scan can still be resumed in a future update.
       await cacheSet(cacheKey,{pages:savedPages.concat(Array(Math.max(0,pdfDoc.numPages-savedPages.length)).fill(null)),partial:true});
       const wrap=page.closest('.page-wrap'),title=wrap&&wrap.querySelector('.page-title');
       if(title)title.textContent=`第 ${n} 页 · 已识别 ${lines.length} 行`;
     }
     await cacheSet(cacheKey,{pages:savedPages,partial:false});
     say(`识别完成，结果已保存在这台设备的浏览器中。${hasAnySelection?'框选优先模式：仅识别已框选页面，未框选页面已跳过。':'未使用框选，已识别整页。'}点击文字即可朗读。`);
   }catch(e){
     if(cancelOcrRequested || (e&&String(e.message||e).includes('停止识别'))){say('已停止识别。已完成页面的结果可能保留；可以重新框选或再次识别。');}
     else {console.error(e);say('处理失败：'+(e.message||e)+'\n请检查浏览器存储权限、网络或尝试较小的 PDF。');}
   } finally {
     ocrRunning=false; ocrBtn.disabled=!pdfDoc; document.getElementById('stopOcrBtn').disabled=true;
     selectBtn.disabled=false; document.getElementById('clearSelectBtn').disabled=false;
     if(worker && cancelOcrRequested){try{await worker.terminate()}catch(e){} worker=null;}
     cancelOcrRequested=false;
   }
 });
 document.getElementById('stopOcrBtn').addEventListener('click',async()=>{
   if(!ocrRunning)return;
   cancelOcrRequested=true; say('正在停止识别，请稍候…');
   const oldWorker=worker; worker=null;
   if(oldWorker){try{await oldWorker.terminate()}catch(e){}}
 });
 let activePage=1;
 // Heuristic layout filter: keep text-like lines and suppress isolated, tiny labels often found inside illustrations.
 // It never extracts/converts image pixels; OCR only returns text candidates. This is a conservative heuristic, not perfect image understanding.
 function filterIllustrationLikeLines(lines, pageW, pageH, language){
   if(!lines.length) return lines;
   const stats=lines.map(line=>{
     const xs=line.words.map(w=>w.bbox.x0), ys=line.words.map(w=>w.bbox.y0),
       xe=line.words.map(w=>w.bbox.x1), ye=line.words.map(w=>w.bbox.y1);
     const x0=Math.min(...xs), y0=Math.min(...ys), x1=Math.max(...xe), y1=Math.max(...ye);
     const text=line.words.map(w=>w.text).join(' ');
     return {line,x0,y0,x1,y1,width:x1-x0,height:y1-y0,text,chars:text.replace(/\s/g,'').length,conf:line.words.reduce((a,w)=>a+w.confidence,0)/line.words.length};
   });
   const heights=stats.map(x=>x.height).filter(h=>h>0).sort((a,b)=>a-b);
   const median=heights[Math.floor(heights.length/2)]||12;
   return stats.filter((x,i)=>{
     // Reject low-confidence, very small, isolated snippets; preserve longer sentence-like text.
     if(x.conf<32 && x.chars<5) return false;
     if(x.height<median*0.48 && x.chars<7) return false;
     const nearby=stats.some((y,j)=>i!==j && Math.abs(y.y0-x.y0)<median*2.2 && (Math.abs(y.x0-x.x1)<pageW*0.12 || Math.abs(y.x1-x.x0)<pageW*0.12));
     const hasSentencePunctuation=/[。！？；：,.!?;:]/.test(x.text);
     const longText=x.chars>=12;
     // Tiny isolated text in an illustration is commonly short and separated from normal lines.
     if(!nearby && !hasSentencePunctuation && x.chars<10 && x.width<pageW*0.22) return false;
     // Drop very small text far from the main body when it looks like a lone illustration label.
     if(x.height<median*0.7 && x.chars<9 && x.y0>pageH*0.12 && x.y1<pageH*0.88 && !nearby && !longText) return false;
     return true;
   }).map(x=>x.line);
 }


 function makeOcrCanvas(source){
   const scale=2, out=document.createElement('canvas');
   out.width=source.width*scale; out.height=source.height*scale;
   const ctx=out.getContext('2d',{willReadFrequently:true});
   ctx.fillStyle='#fff';ctx.fillRect(0,0,out.width,out.height);
   ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
   ctx.drawImage(source,0,0,out.width,out.height);
   const image=ctx.getImageData(0,0,out.width,out.height),d=image.data;
   // Gentle contrast enhancement preserves Vietnamese diacritics better than hard thresholding.
   for(let i=0;i<d.length;i+=4){
     const gray=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
     const enhanced=Math.max(0,Math.min(255,(gray-128)*1.28+128));
     d[i]=d[i+1]=d[i+2]=enhanced; d[i+3]=255;
   }
   ctx.putImageData(image,0,0);return out;
 }

 function groupLines(words){
   const lines=[];
   for(const w of words.slice().sort((a,b)=>((a.bbox.y0+a.bbox.y1)/2)-((b.bbox.y0+b.bbox.y1)/2)||a.bbox.x0-b.bbox.x0)){
     const cy=(w.bbox.y0+w.bbox.y1)/2;
     let line=lines.find(l=>Math.abs(l.cy-cy)<Math.max(8,(w.bbox.y1-w.bbox.y0)*0.55));
     if(!line){line={cy,words:[]};lines.push(line)}
     line.words.push(w);line.cy=line.words.reduce((s,x)=>s+(x.bbox.y0+x.bbox.y1)/2,0)/line.words.length;
   }
   lines.forEach(l=>l.words.sort((a,b)=>a.bbox.x0-b.bbox.x0));
   return lines.sort((a,b)=>a.cy-b.cy);
 }
 function speak(text){
   if(!('speechSynthesis' in window)){say('当前浏览器不支持语音朗读，请尝试最新版 Chrome 或 Edge。');return}
   speechSynthesis.cancel();
   const u=new SpeechSynthesisUtterance(text);
   let chosen=voiceSelect.value;
   if(chosen==='auto'){
     const l=langSelect.value;
     chosen=l.includes('vie')?'vi-VN':l.includes('chi_sim')?'zh-CN':'en-US';
   }
   u.lang=chosen;
   const rateInput=document.getElementById('rate');
   u.rate=rateInput?Number(rateInput.value):1;
   const voices=speechSynthesis.getVoices();
   // Prefer an exact locale match. If unavailable, do not silently claim the requested accent is supported.
   const voice=voices.find(v=>v.lang.toLowerCase()===chosen.toLowerCase());
   if(voice)u.voice=voice;
   else {
     const sameFamily=voices.find(v=>v.lang.toLowerCase().startsWith(chosen.slice(0,2).toLowerCase()));
     if(sameFamily)u.voice=sameFamily;
     if(chosen!=='auto')say('设备未找到完全匹配的语音：'+chosen+'。将尝试使用可用的同语言语音；如无声音，请在系统中安装对应语音包。');
   }
   u.onerror=(e)=>say('朗读失败：'+(e.error||'请检查浏览器、音量及对应语言语音包。'));
   u.onstart=()=>say('正在朗读（'+chosen+'）：'+text.slice(0,120));
   u.onend=()=>say('朗读完成。点击其他文字可继续。');
   speechSynthesis.speak(u);
 }
 document.getElementById('stopBtn').addEventListener('click',()=>{speechSynthesis.cancel();say('已停止朗读。')});
 const rateInput=document.getElementById('rate'),rateValue=document.getElementById('rateValue');
 rateInput.addEventListener('input',()=>rateValue.textContent=Number(rateInput.value).toFixed(1)+'×');
 document.getElementById('previewVoiceBtn').addEventListener('click',()=>{
   const l=langSelect.value;
   const demo=l.includes('vie')?'Xin chào! Đây là giọng đọc thử.':l.includes('chi_sim')?'你好！这是当前语音的试听。':'Hello! This is a voice preview.';
   speak(demo);
 });
})();
